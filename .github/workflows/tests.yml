name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Install (base)
        if: ${{ !contains(fromJSON('["3.10","3.12","3.14"]'), matrix.python-version) }}
        run: pip install .

      - name: Install (with xlsx extra)
        if: ${{ contains(fromJSON('["3.10","3.12","3.14"]'), matrix.python-version) }}
        run: pip install .[xlsx]

      - name: Run test suite
        run: python -m unittest discover -s . -p "test_*.py"

      - name: Dependency vulnerability scan
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: .

      - name: Security battering — front 2 (static HTML)
        if: matrix.python-version == '3.13'
        run: python test_front2_batter.py

      - name: Security battering — front 3 (self-serving local)
        if: matrix.python-version == '3.13'
        run: python test_front3_batter.py
